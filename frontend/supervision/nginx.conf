# ---------------------------------------------------------------------------
# Poupal Supervision — nginx du conteneur (copié dans /etc/nginx/conf.d/default.conf).
#
# Le build Vite est fait avec base '/supervision/' : index.html référence
# /supervision/assets/... La gateway publie ce conteneur sous /supervision/ et
# proxifie elle-même /supervision/api/ vers le moteur de remédiation ; ce
# serveur ne voit donc que les fichiers statiques.
#
# Pour rester robuste, les deux formes d'URL sont acceptées :
#   - /supervision/...  (requête transmise telle quelle par la gateway)
#   - /...              (gateway qui retire le préfixe)
# ---------------------------------------------------------------------------
server {
    server_tokens off;
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité (répétés dans les locations qui ajoutent un Cache-Control,
    # car un add_header local annule l'héritage).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Sonde de vie (HEALTHCHECK Docker, supervision, remédiation) ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
    location = /supervision/healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- Assets Vite (nom haché → cache long) --------------------------------
    location ~ ^/(?:supervision/)?assets/(?<asset>.+)$ {
        alias /usr/share/nginx/html/assets/$asset;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Préfixe /supervision/ : fichiers statiques puis fallback SPA ---------
    location /supervision/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    # /supervision (sans barre finale) → /supervision/
    location = /supervision {
        return 301 /supervision/;
    }

    # --- Racine (gateway qui retire le préfixe) : fallback SPA ----------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# ---------------------------------------------------------------------------
# Poupal — configuration nginx pour servir le build Vite (application React).
# Copiée dans /etc/nginx/conf.d/default.conf par le Dockerfile.
#
# Rappel nginx : dès qu'un bloc "location" contient un add_header, il n'hérite
# PLUS des add_header du bloc "server". Les en-têtes de sécurité sont donc
# répétés dans chaque location qui ajoute un Cache-Control.
# ---------------------------------------------------------------------------
server {
    server_tokens off;           # ne pas exposer la version de nginx
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Compression des réponses texte (HTML, CSS, JS, JSON, SVG) -----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- En-têtes de sécurité (durcissement minimal, pilier CYBER) -----------
    # nosniff : le navigateur respecte le Content-Type annoncé.
    # DENY    : la page ne peut pas être affichée dans une iframe (anti-clickjacking).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Sonde de vie ---------------------------------------------------------
    # Utilisée par le HEALTHCHECK Docker, la supervision (Prometheus / Grafana)
    # et le moteur de remédiation automatique. Répond sans lire le disque.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- Fichiers générés par Vite (/assets/index-abc123.js) ------------------
    # Leur nom contient un hachage : ils peuvent être mis en cache un an.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- index.html : jamais mis en cache -------------------------------------
    # C'est lui qui référence les assets hachés : il doit toujours être à jour
    # après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Routage côté client (React Router) -----------------------------------
    # /dashboard, /send/confirm, /transactions/txn_0010… n'existent pas sur le
    # disque : on renvoie index.html et le routeur React affiche la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

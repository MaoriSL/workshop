# ---------------------------------------------------------------------------
# Règles d'enregistrement : les VARIABLES du futur modèle de détection d'anomalies.
# Convention : poupal:<grandeur>:<fenêtre>, toujours avec un label "service" (ou "container").
# Elles sont exportées en CSV par scripts/export_metrics.py et tracées dans Grafana.
# ---------------------------------------------------------------------------
groups:
  - name: poupal-ml-features
    interval: 5s
    rules:
      # --- Trafic HTTP par service (auth, api) : sondes /health, /ready, /metrics exclues (pas du trafic utilisateur) ---
      - record: poupal:http_requests_per_second:rate1m
        expr: sum by (service) (rate(http_requests_total{route!~"/health|/ready|/metrics"}[1m]))

      # "or ... * 0" : la série existe (à 0) même avant la première erreur, pour que les
      # colonnes du jeu de données ML soient toujours présentes.
      - record: poupal:http_error_ratio_4xx:rate1m
        expr: |
          (sum by (service) (rate(http_requests_total{status=~"4..",route!~"/health|/ready|/metrics"}[1m]))
          / clamp_min(sum by (service) (rate(http_requests_total{route!~"/health|/ready|/metrics"}[1m])), 0.001))
          or on (service) (sum by (service) (rate(http_requests_total{route!~"/health|/ready|/metrics"}[1m])) * 0)

      - record: poupal:http_error_ratio_5xx:rate1m
        expr: |
          (sum by (service) (rate(http_requests_total{status=~"5..",route!~"/health|/ready|/metrics"}[1m]))
          / clamp_min(sum by (service) (rate(http_requests_total{route!~"/health|/ready|/metrics"}[1m])), 0.001))
          or on (service) (sum by (service) (rate(http_requests_total{route!~"/health|/ready|/metrics"}[1m])) * 0)

      - record: poupal:http_latency_seconds:p50
        expr: histogram_quantile(0.50, sum by (service, le) (rate(http_request_duration_seconds_bucket{route!~"/health|/ready|/metrics"}[1m])))

      - record: poupal:http_latency_seconds:p95
        expr: histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket{route!~"/health|/ready|/metrics"}[1m])))

      # --- Gateway nginx ---
      - record: poupal:gateway_requests_per_second:rate1m
        expr: sum by (service) (rate(nginx_http_requests_total{route!~"/health|/ready|/metrics"}[1m]))

      - record: poupal:gateway_active_connections
        expr: sum by (service) (nginx_connections_active)

      # --- Métier ---
      - record: poupal:login_failures_per_minute
        expr: sum by (service) (rate(poupal_login_attempts_total{result!="success"}[1m])) * 60

      - record: poupal:login_attempts_per_minute
        expr: sum by (service) (rate(poupal_login_attempts_total[1m])) * 60

      - record: poupal:transactions_per_minute
        expr: sum by (status) (rate(poupal_transactions_total[1m])) * 60

      - record: poupal:transaction_amount_cents:avg5m
        expr: |
          rate(poupal_transaction_amount_cents_sum[5m])
          / clamp_min(rate(poupal_transaction_amount_cents_count[5m]), 0.0001)

      - record: poupal:db_errors_per_minute
        expr: sum by (service) (rate(poupal_db_errors_total[1m])) * 60

      # --- Signaux SIEM : attaques bloquées ou énumération détectée ---
      # Ces métriques relient la corrélation de sécurité au modèle ML. Elles restent à 0
      # lorsqu'aucune source ne dépasse le seuil SIEM.
      - record: poupal:siem_waf_block_sources
        expr: max(poupal_siem_rule_sources{rule="waf_block_burst"}) or vector(0)

      - record: poupal:siem_enumeration_sources
        expr: max(poupal_siem_rule_sources{rule="enumeration"}) or vector(0)

      - record: poupal:siem_rate_limited_sources
        expr: max(poupal_siem_rule_sources{rule="rate_limited_burst"}) or vector(0)

      - record: poupal:siem_bruteforce_sources
        expr: max(poupal_siem_rule_sources{rule="bruteforce_login"}) or vector(0)

      # --- Base de données (postgres_exporter) ---
      - record: poupal:db_connections_active
        expr: sum(pg_stat_activity_count{state="active"})

      - record: poupal:db_connections_total
        expr: sum(pg_stat_activity_count)

      - record: poupal:db_transactions_per_second:rate1m
        expr: sum(rate(pg_stat_database_xact_commit{datname="poupal"}[1m]))

      # --- Conteneurs (cAdvisor), par service compose ---
      - record: poupal:container_cpu_cores:rate1m
        expr: sum by (container) (rate(container_cpu_usage_seconds_total{container!=""}[1m]))

      - record: poupal:container_memory_bytes
        expr: sum by (container) (container_memory_working_set_bytes{container!=""})

      - record: poupal:container_network_receive_bytes:rate1m
        expr: sum by (container) (rate(container_network_receive_bytes_total{container!=""}[1m]))

      - record: poupal:container_network_transmit_bytes:rate1m
        expr: sum by (container) (rate(container_network_transmit_bytes_total{container!=""}[1m]))

      - record: poupal:container_restarts_total
        expr: sum by (container) (container_restart_count{container!=""})

      # --- Disponibilité (0/1) par cible ---
      # Pour gateway et db, "up" ne dit que si l'EXPORTER répond : on combine avec nginx_up / pg_up
      - record: poupal:service_up
        expr: |
          min by (job) (
            up{job=~"auth|api"}
            or label_replace(up{job="gateway"} * on () group_left () max(nginx_up), "job", "gateway", "", "")
            or label_replace(up{job="db"} * on () group_left () max(pg_up), "job", "db", "", "")
          )

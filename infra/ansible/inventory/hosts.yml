# ---------------------------------------------------------------------------
# Inventaire Poupal : tout s'exécute DANS le conteneur ansible-runner (connexion
# locale). Les actions sur les conteneurs passent par DOCKER_HOST (proxy filtrant).
# Les variables communes aux playbooks sont définies ici.
# ---------------------------------------------------------------------------
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    # Projet Compose piloté (le dépôt est monté en lecture seule sur /workspace)
    project: poupal
    compose_file: /workspace/infra/docker-compose.yml
    project_dir: /workspace/infra          # compose y lit .env
    state_dir: /var/lib/poupal-ansible     # volume ansible-state : état persistant de l'exécuteur

    # Services que les playbooks n'ont PAS le droit de toucher : l'exécuteur passe par les
    # proxys du socket Docker pour agir (les arrêter couperait sa propre connexion).
    # Tous les autres services du docker-compose.yml sont gérés (liste managed_services,
    # calculée dans playbooks/_compose_project.yml à partir du fichier compose).
    excluded_services:
      - docker-socket-proxy-ansible
      - docker-socket-proxy-logs
      - ansible-runner

    # Images construites localement et versionnées (candidates au rollback)
    versioned_services: [auth, api, front]

    # Attente « healthy » bornée : 60 essais × 2 s = 2 minutes maximum
    healthy_retries: 60
    healthy_delay: 2

    # URL fournies par compose (valeurs par défaut identiques si lancé autrement)
    base_url: "{{ lookup('env', 'POUPAL_BASE_URL') | default('http://gateway:80', true) }}"
    internal_url: "{{ lookup('env', 'POUPAL_INTERNAL_URL') | default('http://api:8000', true) }}"
    loki_push_url: "{{ lookup('env', 'LOKI_PUSH_URL') | default('http://loki:3100/loki/api/v1/push', true) }}"

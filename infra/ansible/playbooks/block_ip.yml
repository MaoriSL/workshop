---
# ---------------------------------------------------------------------------
# block_ip.yml — bloque une adresse IP à la gateway nginx : ajoute « deny <ip>; »
# dans /etc/nginx/blocklist/blocked_ips.conf (volume gateway-blocklist, inclus par
# nginx.conf) puis recharge nginx SANS coupure (nginx -t && nginx -s reload).
# Idempotent : une IP déjà bloquée n'est pas ajoutée deux fois.
# Usage : ansible-playbook playbooks/block_ip.yml -e ip=203.0.113.42
# ---------------------------------------------------------------------------
- name: Bloquer une adresse IP à la gateway Poupal
  hosts: localhost
  gather_facts: false
  vars:
    action_name: block_ip
    service_target: gateway
    gateway_container: poupal-gateway
    blocklist_file: /etc/nginx/blocklist/blocked_ips.conf
    ip: ""
    # Validation stricte : seule une IP (v4 / v6, préfixe CIDR facultatif) entre dans la config nginx
    ipv4_regex: '^(?:25[0-5]|2[0-4]\d|1?\d?\d)(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}(?:/(?:3[0-2]|[12]?\d))?$'
    ipv6_regex: '^(?=.*:)[0-9A-Fa-f:.]{2,45}(?:/(?:12[0-8]|1[01]\d|[1-9]?\d))?$'

  tasks:
    - name: Démarrer le chronomètre de l'action
      ansible.builtin.set_fact:
        remediation_started: "{{ now(utc=true).timestamp() }}"
        remediation_result: ko
        remediation_details: ""

    - name: Blocage (journalisé quoi qu'il arrive)
      block:
        - name: Vérifier l'adresse demandée
          ansible.builtin.assert:
            that: ip is match(ipv4_regex) or ip is match(ipv6_regex)
            fail_msg: "Variable 'ip' obligatoire : adresse IPv4 ou IPv6 (ex. -e ip=203.0.113.42)"
            quiet: true

        - name: Lire la liste de blocage actuelle
          community.docker.docker_container_exec:
            container: "{{ gateway_container }}"
            argv: [cat, "{{ blocklist_file }}"]
          register: current
          changed_when: false
          failed_when: current.rc != 0

        - name: L'adresse est-elle déjà bloquée ?
          ansible.builtin.set_fact:
            deny_line: "deny {{ ip }};"
            already_blocked: "{{ ('deny ' ~ ip ~ ';') in current.stdout_lines }}"

        - name: "Ajouter « {{ deny_line }} » à la liste"
          community.docker.docker_container_exec:
            container: "{{ gateway_container }}"
            argv: [sh, -c, "echo '{{ deny_line }}' >> {{ blocklist_file }}"]
          register: added
          failed_when: added.rc != 0
          when: not (already_blocked | bool)

        - name: Tester la configuration et recharger nginx (sans coupure)
          community.docker.docker_container_exec:
            container: "{{ gateway_container }}"
            argv: [sh, -c, "nginx -t && nginx -s reload"]
          register: reload
          failed_when: reload.rc != 0
          when: not (already_blocked | bool)

        - name: Vérifier que la gateway répond toujours
          ansible.builtin.uri:
            url: "{{ base_url }}/gateway/health"
            status_code: 200
            timeout: 5

        - name: Noter le succès
          ansible.builtin.set_fact:
            remediation_result: ok
            remediation_details: "{{ ip }} {{ 'déjà bloquée' if already_blocked | bool else 'bloquée, nginx rechargé' }}, gateway opérationnelle"

      rescue:
        - name: Noter l'échec
          ansible.builtin.set_fact:
            remediation_details: "{{ ansible_failed_task.name }} : {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('voir la sortie ci-dessus')) }}"

      always:
        - name: Journaliser l'action (stdout + Loki)
          ansible.builtin.include_tasks: _log_action.yml

        - name: Terminer en erreur si l'action a échoué
          ansible.builtin.fail:
            msg: "{{ action_name }} KO : {{ remediation_details }}"
          when: remediation_result != 'ok'

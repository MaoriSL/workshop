---
# ---------------------------------------------------------------------------
# backup_db.yml — sauvegarde la base PostgreSQL avec pg_dump, DANS le conteneur
# poupal-db, vers le volume db-backups (/backups). L'archive est validée par
# pg_restore --list ; seules les keep_backups plus récentes sont conservées.
# Usage : ansible-playbook playbooks/backup_db.yml [-e keep_backups=10]
# ---------------------------------------------------------------------------
- name: Sauvegarder la base PostgreSQL de Poupal
  hosts: localhost
  gather_facts: false
  vars:
    action_name: backup_db
    service_target: db
    db_container: poupal-db
    backup_dir: /backups
    keep_backups: 10

  tasks:
    - name: Démarrer le chronomètre de l'action
      ansible.builtin.set_fact:
        remediation_started: "{{ now(utc=true).timestamp() }}"
        remediation_result: ko
        remediation_details: ""
        backup_file: "{{ backup_dir }}/poupal-{{ now(utc=true).strftime('%Y%m%dT%H%M%SZ') }}.dump"

    - name: Sauvegarde (journalisée quoi qu'il arrive)
      block:
        - name: "pg_dump au format custom (compressé) vers {{ backup_file }}"
          community.docker.docker_container_exec:
            container: "{{ db_container }}"
            argv:
              - sh
              - -c
              # POSTGRES_USER / POSTGRES_DB : variables d'environnement du conteneur db
              - pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "{{ backup_file }}"
          register: dump
          failed_when: dump.rc != 0

        - name: Valider l'archive (pg_restore --list doit pouvoir la lire)
          community.docker.docker_container_exec:
            container: "{{ db_container }}"
            argv: [pg_restore, --list, "{{ backup_file }}"]
          register: listing
          changed_when: false
          failed_when: listing.rc != 0

        - name: Taille de l'archive
          community.docker.docker_container_exec:
            container: "{{ db_container }}"
            argv: [stat, -c, "%s", "{{ backup_file }}"]
          register: size
          changed_when: false

        - name: "Ne conserver que les {{ keep_backups }} sauvegardes les plus récentes"
          community.docker.docker_container_exec:
            container: "{{ db_container }}"
            argv:
              - sh
              - -c
              - >-
                ls -1t {{ backup_dir }}/poupal-*.dump | tail -n +{{ keep_backups | int + 1 }}
                | while read -r f; do rm -f "$f" && echo "supprimé $f"; done
          register: pruned
          changed_when: pruned.stdout | length > 0

        - name: Sauvegardes disponibles
          community.docker.docker_container_exec:
            container: "{{ db_container }}"
            argv: [sh, -c, "ls -1 {{ backup_dir }}/poupal-*.dump"]
          register: remaining
          changed_when: false

        - name: Liste des sauvegardes
          ansible.builtin.debug:
            msg: "{{ remaining.stdout_lines }}"

        - name: Tracer la sauvegarde dans l'état persistant de l'exécuteur (facultatif)
          ansible.builtin.lineinfile:
            path: "{{ state_dir }}/backups.log"
            line: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }} {{ backup_file }} {{ size.stdout | trim }} octets"
            create: true
            mode: "0644"
          failed_when: false

        - name: Noter le succès
          ansible.builtin.set_fact:
            remediation_result: ok
            remediation_details: >-
              {{ backup_file }} ({{ size.stdout | trim }} octets, {{ listing.stdout_lines | length }} entrées),
              {{ pruned.stdout_lines | length }} ancienne(s) supprimée(s)

      rescue:
        - name: Noter l'échec
          ansible.builtin.set_fact:
            remediation_details: "{{ ansible_failed_task.name }} : {{ ansible_failed_result.stderr | default(ansible_failed_result.msg | default('voir la sortie ci-dessus')) }}"

      always:
        - name: Journaliser l'action (stdout + Loki)
          ansible.builtin.include_tasks: _log_action.yml

        - name: Terminer en erreur si l'action a échoué
          ansible.builtin.fail:
            msg: "{{ action_name }} KO : {{ remediation_details }}"
          when: remediation_result != 'ok'

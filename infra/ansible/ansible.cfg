# ---------------------------------------------------------------------------
# Poupal — configuration Ansible du conteneur ansible-runner.
# Désignée explicitement par ANSIBLE_CONFIG (Dockerfile) : Ansible ignore un
# ansible.cfg trouvé dans un répertoire « world-writable », ce qui est le cas
# d'un dépôt monté depuis Windows. Tout s'exécute en local (inventory/hosts.yml),
# les actions sur Docker passent par DOCKER_HOST (proxy filtrant du socket).
# ---------------------------------------------------------------------------
[defaults]
inventory = /workspace/infra/ansible/inventory/hosts.yml
collections_path = /usr/share/ansible/collections

# Playbooks courts et locaux : pas de collecte de faits (now() suffit pour l'horodatage)
gathering = explicit

# Sortie lisible dans la console : résultats au format YAML, hôtes ignorés masqués
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = false

# Pas de fichier .retry (le dépôt est monté en lecture seule)
retry_files_enabled = false

# Fichiers temporaires d'Ansible dans le HOME de l'utilisateur non-root
local_tmp = ~/.ansible/tmp
remote_tmp = ~/.ansible/tmp
interpreter_python = auto_silent
deprecation_warnings = false

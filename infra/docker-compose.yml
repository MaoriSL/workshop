# ------------------------------------------------------------------
# Poupal — plateforme de paiement FICTIVE (démonstrateur Resilience-Alpha)
# Lancement : cd infra && docker compose up -d --build
# Pré-requis : infra/.env (copie de .env.example) et scripts/gen_keys.sh (clés JWT dans secrets/).
#
# Réseaux : edge (gateway, front, trafic), backend (auth, api, db), monitoring (supervision).
# Chaque conteneur n'est branché que sur les réseaux dont il a besoin ; la base reste sur backend.
# Ports publiés : gateway (0.0.0.0:8080), Grafana et Prometheus (127.0.0.1 uniquement). Rien d'autre.
# Toutes les images portent un tag de version précis (déploiement reproductible) et une limite mémoire.
# ------------------------------------------------------------------
name: poupal

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  # ======================= Plateforme Poupal =======================
  db:
    image: postgres:16.9-alpine
    container_name: poupal-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poupal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans infra/.env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD manquant dans infra/.env}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?API_DB_PASSWORD manquant dans infra/.env}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?EXPORTER_DB_PASSWORD manquant dans infra/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - db-backups:/backups                         # sauvegardes pg_dump (playbook backup_db.yml)
      - ./db/init:/docker-entrypoint-initdb.d:ro   # rôles + schémas, exécuté au premier démarrage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-poupal}"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy: { resources: { limits: { memory: 384m } } }
    networks: [backend]
    logging: *default-logging
    restart: unless-stopped

  auth:
    build:
      context: ../services/auth
      target: runtime
    image: poupal/auth:${AUTH_IMAGE_TAG:-0.1.0}
    container_name: poupal-auth
    environment:
      SERVICE_NAME: poupal-auth
      DATABASE_URL: postgresql+psycopg://poupal_auth:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB:-poupal}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-poupal-auth}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/60}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_private.pem
      - jwt_public.pem
    depends_on:
      db: { condition: service_healthy }
    expose: ["8001"]
    deploy: { resources: { limits: { memory: 192m } } }
    networks: [backend, monitoring]
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: ../services/api
      target: runtime
    image: poupal/api:${API_IMAGE_TAG:-0.1.0}
    container_name: poupal-api
    environment:
      SERVICE_NAME: poupal-api
      DATABASE_URL: postgresql+psycopg://poupal_api:${API_DB_PASSWORD}@db:5432/${POSTGRES_DB:-poupal}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ISSUER: ${JWT_ISSUER:-poupal-auth}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TRANSACTION_RATE_LIMIT: ${TRANSACTION_RATE_LIMIT:-10/60}
      MAX_TRANSACTION_CENTS: ${MAX_TRANSACTION_CENTS:-500000}
      DEMO_INITIAL_BALANCE_CENTS: ${DEMO_INITIAL_BALANCE_CENTS:-100000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    secrets:
      - jwt_public.pem          # clé PUBLIQUE uniquement : l'API ne peut pas signer de jeton
    depends_on:
      db: { condition: service_healthy }
      auth: { condition: service_healthy }   # la vue auth.user_directory doit exister
    expose: ["8000"]
    deploy: { resources: { limits: { memory: 192m } } }
    networks: [backend, monitoring]
    logging: *default-logging
    restart: unless-stopped

  front:
    build:
      context: ../frontend/poupal
      args:
        VITE_API_URL: ""          # même origine que la gateway (/auth, /api)
        VITE_USE_MOCK: "false"
    image: poupal/front:${FRONT_IMAGE_TAG:-0.1.0}
    container_name: poupal-front
    expose: ["80"]
    deploy: { resources: { limits: { memory: 48m } } }
    networks: [edge]
    logging: *default-logging
    restart: unless-stopped

  gateway:
    image: nginx:1.27.5-alpine
    container_name: poupal-gateway
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/10-init-blocklist.sh:/docker-entrypoint.d/10-init-blocklist.sh:ro
      - gateway-blocklist:/etc/nginx/blocklist     # liste d'IP bloquées (playbooks block_ip / unblock_ip)
    ports:
      - "0.0.0.0:${GATEWAY_PORT:-8080}:80"          # SEUL accès depuis le réseau du groupe
    expose: ["8081"]                                # stub_status (réseau Docker uniquement)
    depends_on:
      auth: { condition: service_healthy }
      api: { condition: service_healthy }
      front: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy: { resources: { limits: { memory: 64m } } }
    networks: [edge, backend]
    logging: *default-logging
    restart: unless-stopped

  # ======================= Supervision (budget ≤ 2 Go) =======================
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: poupal-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"   # PC Hôte uniquement
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 512m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: poupal-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD manquant dans infra/.env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/poupal-services.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"      # PC Hôte uniquement
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 256m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    container_name: poupal-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose: ["3100"]                                # jamais publié sur l'hôte
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy: { resources: { limits: { memory: 384m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.1
    container_name: poupal-alloy
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      loki: { condition: service_healthy }
      docker-socket-proxy-logs: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf \"GET /-/ready HTTP/1.0\r\n\r\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 192m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  # Métriques des conteneurs. cAdvisor ne fonctionne PAS sous Docker Desktop / WSL2 avec le
  # magasin d'images containerd (driver "overlayfs") : il ne lit pas les couches des conteneurs
  # et n'expose rien par conteneur. Remplacé par un petit exporter maison (tools/docker-stats-exporter)
  # qui interroge l'API Docker via le proxy EN LECTURE SEULE et publie les mêmes noms de métriques.
  docker-stats-exporter:
    build:
      context: ../tools/docker-stats-exporter
    image: poupal/docker-stats-exporter:${EXPORTER_IMAGE_TAG:-0.1.0}
    container_name: poupal-docker-stats-exporter
    environment:
      DOCKER_URL: http://docker-socket-proxy-logs:2375
      COMPOSE_PROJECT: poupal
      SCRAPE_INTERVAL: "5"
    depends_on:
      docker-socket-proxy-logs: { condition: service_healthy }
    expose: ["9417"]
    deploy: { resources: { limits: { memory: 64m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    container_name: poupal-nginx-exporter
    command: ["--nginx.scrape-uri=http://gateway:8081/stub_status"]
    depends_on:
      gateway: { condition: service_healthy }
    expose: ["9113"]
    deploy: { resources: { limits: { memory: 32m } } }
    networks: [edge, monitoring]
    logging: *default-logging
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: poupal-postgres-exporter
    environment:
      # Rôle SQL dédié en LECTURE SEULE (créé par infra/db/init/02-exporter-role.sh)
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-poupal}?sslmode=disable
      DATA_SOURCE_USER: poupal_exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    expose: ["9187"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9187/metrics"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy: { resources: { limits: { memory: 64m } } }
    networks: [backend, monitoring]
    logging: *default-logging
    restart: unless-stopped

  # ======================= Accès Docker contrôlé =======================
  # Deux proxys du socket Docker, chacun n'autorisant QUE les appels nécessaires :
  #  - logs    : lecture seule (lister / inspecter / lire les logs) pour Alloy ;
  #  - ansible : lister, inspecter, démarrer/arrêter/redémarrer, créer, supprimer, exec,
  #              images, réseaux, volumes — jamais le socket complet (ni build, ni swarm...).
  docker-socket-proxy-logs:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: poupal-socket-proxy-logs
    environment:
      LOG_LEVEL: warning
      CONTAINERS: 1
      NETWORKS: 1      # lecture des réseaux : labels de découverte d'Alloy
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["2375"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy: { resources: { limits: { memory: 32m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  docker-socket-proxy-ansible:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: poupal-socket-proxy-ansible
    environment:
      LOG_LEVEL: warning
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      EXEC: 1
      INFO: 1
      POST: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      BUILD: 0
      COMMIT: 0
      SWARM: 0
      SERVICES: 0
      SECRETS: 0
      CONFIGS: 0
      PLUGINS: 0
      SYSTEM: 0
      AUTH: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["2375"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy: { resources: { limits: { memory: 32m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  # Exécuteur Ansible (profil "tools" : démarré à la demande, jamais en permanence).
  # Usage : docker compose run --rm ansible-runner ansible-playbook playbooks/restart_service.yml -e service=api
  ansible-runner:
    build:
      context: ./ansible
    image: poupal/ansible-runner:${ANSIBLE_IMAGE_TAG:-0.1.0}
    container_name: poupal-ansible-runner
    # Service permanent : API minimale d'exécution des playbooks (liste blanche) pour le moteur de
    # remédiation. Les humains utilisent toujours `docker compose run --rm ansible-runner ansible-playbook ...`.
    command: ["python3", "/workspace/infra/ansible/runner_api.py"]
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?RUNNER_TOKEN manquant dans infra/.env}
      DOCKER_HOST: tcp://docker-socket-proxy-ansible:2375
      COMPOSE_PROJECT_NAME: poupal
      POUPAL_BASE_URL: http://gateway:80
      POUPAL_INTERNAL_URL: http://api:8000
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
      SMOKE_PASSWORD: ${DEMO_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-poupal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      ANSIBLE_FORCE_COLOR: "1"
    volumes:
      - ..:/workspace:ro            # dépôt complet en lecture seule (compose, scripts, playbooks)
      - ansible-state:/var/lib/poupal-ansible
    working_dir: /workspace/infra/ansible
    expose: ["8011"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8011/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy: { resources: { limits: { memory: 384m } } }
    networks: [edge, backend, monitoring]
    logging: *default-logging
    restart: unless-stopped

  # ======================= Trafic « normal » pour l'apprentissage ML =======================
  traffic-gen:
    build:
      context: ../tools/traffic-gen
    image: poupal/traffic-gen:${TRAFFIC_IMAGE_TAG:-0.1.0}
    container_name: poupal-traffic-gen
    environment:
      TRAFFIC_ENABLED: ${TRAFFIC_ENABLED:-true}
      TRAFFIC_BASE_URL: http://gateway:80
      TRAFFIC_USERS: ${TRAFFIC_USERS:-10}
      TRAFFIC_INTENSITY: ${TRAFFIC_INTENSITY:-1.0}
      TRAFFIC_PASSWORD: ${DEMO_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; p='/tmp/traffic-gen.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy: { resources: { limits: { memory: 96m } } }
    networks: [edge]
    logging: *default-logging
    restart: unless-stopped

  # ======================= Détection d'anomalies (ML) =======================
  # Détecte mais n'agit pas : lecture seule sur Prometheus, aucun accès à Docker, réseau monitoring.
  # Le modèle (ml/detection/models) est monté en lecture seule ; réentraîner = python -m ml.detection.train.
  anomaly-detector:
    build:
      context: ..
      dockerfile: ml/detection/service/Dockerfile
    image: poupal/anomaly-detector:${DETECTOR_IMAGE_TAG:-0.1.0}
    container_name: poupal-anomaly-detector
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      MODEL_DIR: /models
      DETECTOR_INTERVAL_S: "5"
      DETECTOR_CONFIRM_N: ${DETECTOR_CONFIRM_N:-2}
      DETECTOR_CONFIRM_M: ${DETECTOR_CONFIRM_M:-3}
      DETECTOR_RECOVER_R: ${DETECTOR_RECOVER_R:-6}
      REMEDIATION_URL: ${REMEDIATION_URL:-http://remediation-engine:8002/incidents}
      REMEDIATION_HMAC_SECRET: ${REMEDIATION_HMAC_SECRET:?REMEDIATION_HMAC_SECRET manquant dans infra/.env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../ml/detection/models:/models:ro
    depends_on:
      prometheus: { condition: service_healthy }
    expose: ["8010"]
    deploy: { resources: { limits: { memory: 512m } } }
    networks: [monitoring]
    logging: *default-logging
    restart: unless-stopped

  # ======================= Remédiation automatique (zero-touch) =======================
  # Reçoit les incidents signés (HMAC) du détecteur, choisit un plan dans un catalogue fixe, exécute
  # UNIQUEMENT des playbooks de la liste blanche via ansible-runner, puis PROUVE la reprise (service
  # healthy + nouvelle transaction réussie + cohérence des soldes). Jamais exposé par la gateway
  # (seuls /api/state, /api/incidents et /api/events en GET le sont, pour le dashboard).
  remediation-engine:
    build:
      context: ..
      dockerfile: services/remediation/Dockerfile
    image: poupal/remediation-engine:${REMEDIATION_IMAGE_TAG:-0.1.0}
    container_name: poupal-remediation-engine
    environment:
      REMEDIATION_HMAC_SECRET: ${REMEDIATION_HMAC_SECRET:?REMEDIATION_HMAC_SECRET manquant dans infra/.env}
      REMEDIATION_DRY_RUN: ${REMEDIATION_DRY_RUN:-false}
      REMEDIATION_ACTION_TIMEOUT_S: ${REMEDIATION_ACTION_TIMEOUT_S:-30}
      REMEDIATION_MIN_DELAY_S: ${REMEDIATION_MIN_DELAY_S:-5}
      REMEDIATION_BREAKER_LIMIT: ${REMEDIATION_BREAKER_LIMIT:-8}
      REMEDIATION_BREAKER_WINDOW_MIN: ${REMEDIATION_BREAKER_WINDOW_MIN:-10}
      REMEDIATION_PROTECTED_NETWORKS: ${REMEDIATION_PROTECTED_NETWORKS:-}
      RUNNER_URL: http://ansible-runner:8011
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      LOKI_URL: http://loki:3100
      PROMETHEUS_URL: http://prometheus:9090
      DETECTOR_URL: http://anomaly-detector:8010
      GATEWAY_URL: http://gateway:80
      API_INTERNAL_URL: http://api:8000
      SMOKE_PASSWORD: ${DEMO_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      ansible-runner: { condition: service_healthy }
      prometheus: { condition: service_healthy }
    expose: ["8002"]
    deploy: { resources: { limits: { memory: 256m } } }
    networks: [backend, monitoring]
    logging: *default-logging
    restart: unless-stopped

  # Dashboard de supervision (lecture seule), servi par la gateway sous /supervision/
  supervision:
    build:
      context: ../frontend/supervision
    image: poupal/supervision:${SUPERVISION_IMAGE_TAG:-0.1.0}
    container_name: poupal-supervision
    expose: ["80"]
    deploy: { resources: { limits: { memory: 48m } } }
    networks: [edge]
    logging: *default-logging
    restart: unless-stopped

# Clés JWT générées par scripts/gen_keys.sh, montées en lecture seule dans /run/secrets/
secrets:
  jwt_private.pem:
    file: ../secrets/jwt_private.pem
  jwt_public.pem:
    file: ../secrets/jwt_public.pem

volumes:
  db-data:
  db-backups:
  gateway-blocklist:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  ansible-state:

networks:
  edge:        # exposition : gateway, front, générateur de trafic
    driver: bridge
  backend:     # cœur métier : auth, api, base de données
    driver: bridge
  monitoring:  # supervision : Prometheus, Grafana, Loki, Alloy, exporters, proxys Docker
    driver: bridge

# ---------------------------------------------------------------------------
# Poupal — gateway nginx : point d'entrée UNIQUE de la plateforme
# (environnement de démonstration, plateforme de paiement fictive).
#
# Image nginx:1.27-alpine ; ce fichier est monté en lecture seule dans
# /etc/nginx/conf.d/default.conf, il est donc inclus dans le bloc "http"
# de la configuration principale (map et log_format y sont autorisés).
#
# Routage :
#   /auth/*          → service auth (8001) : inscription, connexion, profil, /auth/docs
#   /api/*           → service api  (8000) : comptes, transactions, /api/docs
#   /internal/*      → 403 : réservé au réseau Docker (ex. /internal/consistency)
#   /gateway/health  → 200 "ok" : sonde de la gateway elle-même (healthcheck compose)
#   /*               → front (application React servie par son propre nginx)
#
# Les sondes /health, /ready et /metrics des services ne sont PAS exposées :
# seules les routes ci-dessus sortent du réseau Docker.
# ---------------------------------------------------------------------------

# Identifiant de corrélation des requêtes (X-Request-ID).
# On conserve celui du client s'il est bien formé (1 à 64 caractères sûrs),
# sinon nginx en génère un ($request_id : 32 caractères hexadécimaux).
# Le même identifiant est transmis aux services, renvoyé au client et journalisé.
map $http_x_request_id $poupal_request_id {
    default                     $request_id;
    "~^[A-Za-z0-9._-]{1,64}$"   $http_x_request_id;
}

# Log d'accès au format JSON : une ligne par requête, même structure que les
# logs des services (collecte par Loki, corrélation par request_id).
# escape=json garantit un JSON valide quel que soit le contenu des en-têtes.
log_format poupal_json escape=json
    '{'
        '"timestamp":"$time_iso8601",'
        '"service":"poupal-gateway",'
        '"event":"http_request",'
        '"request_id":"$poupal_request_id",'
        '"client_ip":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"query":"$args",'
        '"status":$status,'
        '"bytes_sent":$body_bytes_sent,'
        '"request_time_s":$request_time,'
        '"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_time_s":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"'
    '}';

server {
    listen 80;
    server_name _;

    # Ne jamais révéler la version de nginx (en-tête Server, pages d'erreur).
    server_tokens off;

    # Résolution des noms de conteneurs par le DNS interne de Docker, ré-évaluée
    # toutes les 10 s. Grâce aux variables, nginx démarre même si un service
    # n'est pas encore résolu, et retrouve un conteneur recréé par la
    # remédiation automatique sans redémarrer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Derrière le WAF : l'IP réelle du client vient de X-Forwarded-For posé par le WAF.
    # On fait confiance au sous-réseau du WAF (edge) et SANS récursion : nginx prend la DERNIÈRE
    # entrée de X-Forwarded-For (celle que le WAF a ajoutée = vrai client), jamais une valeur que
    # le client aurait lui-même injectée à gauche. Protège contre l'usurpation d'IP (faire bloquer
    # un tiers). La gateway n'étant joignable que via le WAF, ce sous-réseau est un périmètre sûr.
    set_real_ip_from 172.31.0.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    set $auth_upstream  http://auth:8001;
    set $api_upstream   http://api:8000;
    set $front_upstream http://front:80;
    set $supervision_upstream http://supervision:80;
    set $remediation_upstream http://remediation-engine:8002;

    access_log /var/log/nginx/access.log poupal_json;

    # --- Liste de blocage d'IP (remédiation : playbooks block_ip / unblock_ip) --------
    # Fichier dans un volume dédié, rechargé SANS coupure par "nginx -s reload".
    # Une ligne par IP : deny 203.0.113.42;
    include /etc/nginx/blocklist/blocked_ips.conf;

    # Les corps JSON de Poupal font quelques centaines d'octets : 1 Mo suffit
    # largement et limite l'impact d'un envoi massif.
    client_max_body_size 1m;

    # --- En-têtes de sécurité, sur TOUTES les réponses (erreurs comprises) ---
    # nosniff : le navigateur respecte le Content-Type annoncé.
    # DENY    : aucune page ne peut être affichée dans une iframe (anti-clickjacking).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $poupal_request_id always;

    # Les services et le front ajoutent déjà ces en-têtes : on masque leur
    # version pour que la gateway soit la source unique (pas de doublons).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Request-ID;

    # --- En-têtes transmis aux services ---------------------------------------
    # Définis ici une seule fois : chaque location proxy_pass en hérite tant
    # qu'elle ne déclare aucun proxy_set_header (règle d'héritage nginx).
    # $http_host conserve le port (localhost:8080) pour les redirections FastAPI.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Request-ID      $poupal_request_id;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;

    # Délais courts : un service qui ne répond plus doit être détecté vite.
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Service injoignable (conteneur arrêté, nom non résolu, délai dépassé) :
    # réponse JSON sobre, au même format que les erreurs applicatives.
    # Les erreurs renvoyées PAR les services (ex. 503 database_error) passent
    # telles quelles (proxy_intercept_errors reste désactivé).
    error_page 502 503 504 = @service_unavailable;

    location @service_unavailable {
        default_type application/json;
        return 503 '{"message":"Service temporairement indisponible.","code":"service_unavailable"}';
    }

    # --- Sonde de la gateway (healthcheck compose, supervision) ---------------
    location = /gateway/health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- Endpoints internes : jamais accessibles depuis l'extérieur -----------
    # /internal/consistency (API) est réservé au réseau Docker (remédiation,
    # supervision). Bloqué ici avant toute autre règle.
    location ~ ^/internal(/|$) {
        default_type application/json;
        return 403 '{"message":"Accès interdit.","code":"forbidden"}';
    }

    # --- Service d'authentification (y compris /auth/docs, /auth/openapi.json)
    location /auth/ {
        proxy_pass $auth_upstream;
    }

    # --- API métier de paiement (y compris /api/docs, /api/openapi.json) ------
    location /api/ {
        proxy_pass $api_upstream;
    }

    # --- Dashboard de supervision (lecture seule) ------------------------------
    # Seules les routes de LECTURE du moteur de remédiation sont proxifiées (GET) ; POST /incidents
    # et tout le reste du moteur restent inaccessibles depuis l'extérieur.
    location = /supervision/api/events {
        limit_except GET { deny all; }
        proxy_pass $remediation_upstream/api/events;
        proxy_buffering off;              # Server-Sent Events : pas de mise en tampon
        proxy_set_header Connection "";   # connexion persistante vers le moteur (flux long)
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $poupal_request_id;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
    location ~ ^/supervision/api/(state|incidents)$ {
        limit_except GET { deny all; }
        proxy_pass $remediation_upstream/api/$1;
    }
    location ~ ^/supervision/api/ {
        default_type application/json;
        return 403 '{"message":"Accès interdit.","code":"forbidden"}';
    }
    # proxy_pass avec variable : l'URI doit être reconstruite explicitement ($1), sinon tout
    # irait vers "/" (index.html à la place des fichiers JS/CSS).
    location ~ ^/supervision/(.*)$ {
        proxy_pass $supervision_upstream/$1$is_args$args;
    }
    location = /supervision {
        return 301 /supervision/;
    }

    # --- Front React (SPA) : tout le reste ------------------------------------
    # Le nginx du front renvoie index.html pour les routes côté client.
    location / {
        proxy_pass $front_upstream;
    }
}

# ---------------------------------------------------------------------------
# Métriques nginx (stub_status) : port 8081, réseau Docker uniquement (jamais publié).
# Lu par nginx-prometheus-exporter, qui les traduit pour Prometheus.
# ---------------------------------------------------------------------------
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log off;

    location = /stub_status {
        stub_status;
    }

    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# Poupal — Console d'attaque (laboratoire). nginx du conteneur
# (copié dans /etc/nginx/conf.d/default.conf).
#
# Le build Vite est fait avec base './': index.html référence ses assets en
# relatif. Ce serveur publie donc la SPA à la RACINE de son origine.
#
# L'orchestrateur est appelé en MÊME ORIGINE sous /api/... Par défaut ce
# serveur ne sert QUE les fichiers statiques : c'est la gateway de
# l'intégrateur qui proxifie /api/ (y compris le flux SSE /api/events) vers
# l'orchestrateur. Pour un déploiement autonome (console + orchestrateur
# ensemble), décommenter et adapter le bloc `location /api/` en bas.
# ---------------------------------------------------------------------------
server {
    server_tokens off;
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # En-têtes de sécurité (répétés dans les locations qui ajoutent un
    # Cache-Control, car un add_header local annule l'héritage).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Sonde de vie (HEALTHCHECK Docker) -----------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- Assets Vite (nom haché → cache long) --------------------------------
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # --- SPA : fichiers statiques puis repli index.html ----------------------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- Orchestrateur (déploiement autonome) --------------------------------
    # À décommenter et adapter si cette image sert aussi de reverse-proxy vers
    # l'orchestrateur. Le `proxy_buffering off` est indispensable au flux SSE.
    #
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $orchestrator http://attack-orchestrator:8099;
        proxy_pass $orchestrator$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;        # SSE : ne pas tamponner /api/events
        proxy_read_timeout 1h;
    }
}

# ---------------------------------------------------------------------------
# Exclusions Poupal — réduire les faux positifs du CRS sur notre trafic légitime.
# Monté dans /etc/modsecurity.d/ (chargé après les règles CRS). Ajuster au besoin
# selon les faux positifs mesurés (voir docs/security.md).
#
# Le front et le générateur de trafic envoient du JSON simple (email, montant, message).
# On NE désactive AUCUNE règle d'injection (SQLi/XSS) : ce sont elles qu'on démontre.
# On lève seulement des règles trop strictes sur des routes/charges légitimes connues.
# ---------------------------------------------------------------------------

# Les réponses de documentation OpenAPI (/auth/docs, /api/docs) contiennent du HTML/JS Swagger :
# on n'inspecte pas le CORPS des réponses de ces routes (règles de fuite de données 95x).
SecRule REQUEST_URI "@beginsWith /auth/docs" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveByTag=OWASP_CRS/DATA_LEAKAGE,ctl:ruleEngine=DetectionOnly"
SecRule REQUEST_URI "@beginsWith /api/docs" "id:10002,phase:1,pass,nolog,ctl:ruleRemoveByTag=OWASP_CRS/DATA_LEAKAGE,ctl:ruleEngine=DetectionOnly"

# Flux Server-Sent Events du dashboard (/supervision/api/events) : connexion longue, pas de corps à inspecter.
SecRule REQUEST_URI "@contains /api/events" "id:10003,phase:1,pass,nolog,ctl:ruleEngine=DetectionOnly"
